org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# KSP (needed for Hilt's compiler) still registers its generated-sources output via the legacy
# kotlinSourceSets DSL, which AGP 9's built-in-Kotlin compilation disallows by default. This is
# the fix the Gradle error itself names; revisit once KSP adapts to the new android.sourceSets DSL.
android.disallowKotlinSourceSets=false
