name: CI

# Unit tests and lint on every push (except the two release branches, which run them as part of
# publishing) and on every pull request.
on:
  push:
    branches-ignore:
      - beta
      - live
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintRelease --no-daemon

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
