name: Build Beta

# Builds, signs and publishes a pre-release from main (version suffix -beta.N, numbered automatically).
# Start it by committing to main with a message that begins with "beta:", or press "Run workflow" for this
# workflow in the Actions tab.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: beta-build
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'beta:')
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # A beta of a version that already has its stable release would sort below it and never be offered as an update.
      - name: Refuse a beta of an already-released version
        run: |
          VERSION=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then echo "::error::Could not read appVersionName from app/build.gradle.kts."; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Version ${VERSION} is already released. Raise appVersionName in app/build.gradle.kts for the next version, then build the beta."
            exit 1
          fi

      # Never publish an APK signed with the throwaway debug key: it could not be updated later.
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set the repository secrets KEYSTORE_BASE64, KEY_ALIAS and KEY_PASSWORD (see CONTRIBUTING.md)."
            exit 1
          fi

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintRelease --no-daemon

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      - name: Create signing.properties
        run: |
          echo "STORE_FILE=keystore.jks" >> app/signing.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> app/signing.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> app/signing.properties

      - name: Build beta APK
        run: ./gradlew assembleBeta --no-daemon -Passistant.updateRepo=${{ github.repository }}

      - name: Get APK path
        id: apk-path
        run: echo "path=$(find app/build/outputs/apk/beta -name '*.apk' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Get APK info
        id: apk-info
        uses: hkusu/apk-info-action@v1
        with:
          apk-path: ${{ steps.apk-path.outputs.path }}

      - name: Generate tag
        id: tag
        run: echo "tag=v${{ steps.apk-info.outputs.version-name }}" >> "$GITHUB_OUTPUT"

      # The app shows these lines under "What's new" when it offers this build as an update.
      - name: Write release notes
        run: tools/release_notes.sh beta "${{ github.repository }}" "${{ steps.tag.outputs.tag }}" > release-notes.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: beta-apk
          path: ${{ steps.apk-path.outputs.path }}
          if-no-files-found: error

      # Keep this: it is what turns an obfuscated crash trace back into readable code.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: beta-mapping
          path: app/build/outputs/mapping/beta/mapping.txt
          if-no-files-found: warn

      - name: Create pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body_path: release-notes.md
          files: ${{ steps.apk-path.outputs.path }}
