name: Build Beta

# Pushing to the `beta` branch builds, signs and publishes a pre-release (version suffix -beta.N, numbered automatically).
on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: beta-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # Never publish an APK signed with the throwaway debug key: it could not be updated later.
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set the repository secrets KEYSTORE_BASE64, KEY_ALIAS and KEY_PASSWORD (see CONTRIBUTING.md)."
            exit 1
          fi

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintRelease --no-daemon

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      - name: Create signing.properties
        run: |
          echo "STORE_FILE=keystore.jks" >> app/signing.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> app/signing.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> app/signing.properties

      - name: Build beta APK
        run: ./gradlew assembleBeta --no-daemon -Passistant.updateRepo=${{ github.repository }}

      - name: Get APK path
        id: apk-path
        run: echo "path=$(find app/build/outputs/apk/beta -name '*.apk' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Get APK info
        id: apk-info
        uses: hkusu/apk-info-action@v1
        with:
          apk-path: ${{ steps.apk-path.outputs.path }}

      - name: Generate tag
        id: tag
        run: echo "tag=v${{ steps.apk-info.outputs.version-name }}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: beta-apk
          path: ${{ steps.apk-path.outputs.path }}
          if-no-files-found: error

      # Keep this: it is what turns an obfuscated crash trace back into readable code.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: beta-mapping
          path: app/build/outputs/mapping/beta/mapping.txt
          if-no-files-found: warn

      - name: Create pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: ${{ steps.apk-path.outputs.path }}
