name: Build Beta

# Builds, signs and publishes a pre-release from main (version suffix -beta.N, numbered automatically).
#
# What starts it: pushing the release notes of the next beta, a new file release-notes/v<version>-beta.<N>.md where N is one more
# than the newest beta (tools/new_release_notes.sh beta writes the file to read, adjust and approve). The pre-release is built
# from the pushed commit and published with those notes as they are written, and a link to everything that changed under them.
# Pushing such a file to any other branch builds and shows the notes and publishes nothing.
#
# From the Actions tab ("Run workflow") a run can also be started by hand, with these options:
#   dry_run     build and show the notes, publish nothing
#   notes_only  put release-notes/<tag>.md on the existing release <tag> again (after a fix to the file), build nothing
on:
  push:
    branches-ignore:
      - stable
    paths:
      - 'release-notes/v*-beta.*.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, show the release notes and publish nothing'
        type: boolean
        default: false
      notes_only:
        description: 'Only put release-notes/<tag>.md on the existing release <tag> again (no build)'
        type: boolean
        default: false
      tag:
        description: 'For notes_only: the beta to put the notes on, for example v1.2.0-beta.4'
        type: string
        required: false

concurrency:
  # Real builds wait for each other. A dry run, or a run on any branch but main, has a group of its own, so that it never
  # holds up a release or takes the place of one that is waiting.
  group: ${{ github.ref == 'refs/heads/main' && inputs.dry_run != true && 'beta-build' || format('beta-dry-run-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  # Decides in seconds what this run does, and fails at once when it cannot: no notes file for the next beta, a file that fails
  # the check, a number that is not the next one. All of it is in tools/plan_release.sh, which tools/test_release_tools.sh tests.
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      tag: ${{ steps.plan.outputs.tag }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
          NOTES_ONLY: ${{ inputs.notes_only }}
          TAG_INPUT: ${{ inputs.tag }}
        run: tools/plan_release.sh beta

  build:
    needs: plan
    if: needs.plan.outputs.mode == 'build' || needs.plan.outputs.mode == 'dry-run'
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      MODE: ${{ needs.plan.outputs.mode }}
      TAG: ${{ needs.plan.outputs.tag }}
      NOTES: ${{ needs.plan.outputs.notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The steps below run actions of other people with the signing key on disk: they get no token through git's configuration.
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # A beta of a version that already has its stable release would sort below it and never be offered as an update.
      - name: Refuse a beta of an already-released version
        run: |
          VERSION=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then echo "::error::Could not read appVersionName from app/build.gradle.kts."; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Version ${VERSION} is already released. Raise appVersionName in app/build.gradle.kts for the next version, then build the beta."
            exit 1
          fi

      # Never publish an APK signed with the throwaway debug key: it could not be updated later.
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set the repository secrets KEYSTORE_BASE64, KEY_ALIAS and KEY_PASSWORD (see CONTRIBUTING.md)."
            exit 1
          fi

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintRelease --no-daemon

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      - name: Create signing.properties
        run: |
          echo "STORE_FILE=keystore.jks" >> app/signing.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> app/signing.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> app/signing.properties

      - name: Build beta APK
        run: ./gradlew assembleBeta --no-daemon -Passistant.updateRepo=${{ github.repository }}

      - name: Get APK path
        id: apk-path
        run: echo "path=$(find app/build/outputs/apk/beta -name '*.apk' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Get APK info
        id: apk-info
        uses: hkusu/apk-info-action@392bb88e75a26c806b71bcb86e4f7ee4c871ff58 # v1.0.3 (the v1 branch)
        with:
          apk-path: ${{ steps.apk-path.outputs.path }}

      # The notes were written for one beta number and Gradle numbers the build itself: they must be the same.
      - name: Check the tag
        id: tag
        env:
          VERSION_NAME: ${{ steps.apk-info.outputs.version-name }}
        run: |
          if [ "v${VERSION_NAME}" != "$TAG" ]; then
            echo "::error::This build is v${VERSION_NAME}, but the release notes are for ${TAG}."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # The app shows these lines under "What's new" when it offers this build as an update.
      - name: Put the release notes together
        run: tools/compose_release_body.sh beta "${{ github.repository }}" "$TAG" "$NOTES" > release-notes.md

      - name: Show the release notes
        run: |
          {
            echo "### ${TAG} (${MODE})"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      # The APK is signed with the release key: it is kept as an artifact only for a real build on main, where it is published anyway. A dry
      # run, or a run on another branch, still builds and signs (that is what proves the secrets work) but leaves no APK for anyone to download.
      - name: Upload build artifact
        if: needs.plan.outputs.mode == 'build' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: beta-apk
          path: ${{ steps.apk-path.outputs.path }}
          if-no-files-found: error

      # Keep this: it is what turns an obfuscated crash trace back into readable code.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: beta-mapping
          path: app/build/outputs/mapping/beta/mapping.txt
          if-no-files-found: warn

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: beta-release-notes
          path: release-notes.md
          if-no-files-found: error

      # Only a run that the plan made a real build, on main, publishes. A dry run ends here.
      - name: Create pre-release
        if: needs.plan.outputs.mode == 'build' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body_path: release-notes.md
          files: ${{ steps.apk-path.outputs.path }}

  # Puts the notes file on a release that exists, without a build: a fix to the text of a page that is out.
  notes:
    needs: plan
    if: needs.plan.outputs.mode == 'notes-only'
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Put the release notes on the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          tools/compose_release_body.sh beta "$GITHUB_REPOSITORY" "$TAG" "$NOTES" > release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md
          {
            echo "### ${TAG}: the release notes were put on the release"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
