name: Build Stable

# Pushing to the `stable` branch builds and signs the release for appVersionName in app/build.gradle.kts and puts it on GitHub as a
# DRAFT, which nobody can see until it is published after a last look at the page and the APK:
#
#     gh release edit v<version> --draft=false --latest
#
# The page of the release is release-notes/v<version>.md, as it is written (tools/new_release_notes.sh stable starts it from the
# commits since the last release and the notes of the betas), with a link to everything that changed under it. A release is the
# build of a beta that was tested: the run stops within seconds when the app changed since the newest beta of this version, or when
# there is none. A version can be published once: raise appVersionName for the next one (the version code follows from it).
#
# From the Actions tab ("Run workflow") a run can also be started by hand, with these options:
#   dry_run        build and show the page, create no release
#   allow_changes  release although the app changed since the newest beta, or there is no beta of this version
on:
  push:
    branches:
      - stable
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, show the release notes and create no release'
        type: boolean
        default: false
      allow_changes:
        description: 'Release although the app changed since the newest beta, or there is no beta of this version'
        type: boolean
        default: false

concurrency:
  # Real releases wait for each other. A dry run, or a run on any branch but stable, has a group of its own.
  group: ${{ github.ref == 'refs/heads/stable' && inputs.dry_run != true && 'stable-build' || format('stable-dry-run-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  # Decides in seconds what this run does, and fails at once when it cannot: no notes file for this version, a file that fails the
  # check, a version that is released already, an app that is not the one of the newest beta. See tools/plan_release.sh.
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      tag: ${{ steps.plan.outputs.tag }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
          ALLOW_CHANGES: ${{ inputs.allow_changes }}
        run: tools/plan_release.sh stable

  build:
    needs: plan
    if: needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'dry-run'
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      MODE: ${{ needs.plan.outputs.mode }}
      TAG: ${{ needs.plan.outputs.tag }}
      NOTES: ${{ needs.plan.outputs.notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The steps below run actions of other people with the signing key on disk: they get no token through git's configuration.
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # Fail in seconds, not after a five-minute build, when the version was not raised.
      - name: Refuse to overwrite an existing release
        run: |
          VERSION=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          TAG="v${VERSION}"
          if [ -z "$VERSION" ]; then echo "::error::Could not read appVersionName from app/build.gradle.kts."; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists. Raise appVersionName in app/build.gradle.kts before publishing a new stable build."
            exit 1
          fi

      # Never publish an APK signed with the throwaway debug key: it could not be updated later.
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set the repository secrets KEYSTORE_BASE64, KEY_ALIAS and KEY_PASSWORD (see CONTRIBUTING.md)."
            exit 1
          fi

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintRelease --no-daemon

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      - name: Create signing.properties
        run: |
          echo "STORE_FILE=keystore.jks" >> app/signing.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> app/signing.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> app/signing.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon -Passistant.updateRepo=${{ github.repository }}

      - name: Get APK path
        id: apk-path
        run: echo "path=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Get APK info
        id: apk-info
        uses: hkusu/apk-info-action@392bb88e75a26c806b71bcb86e4f7ee4c871ff58 # v1.0.3 (the v1 branch)
        with:
          apk-path: ${{ steps.apk-path.outputs.path }}

      # The notes were written for one version and Gradle names the build itself: they must be the same.
      - name: Check the tag
        id: tag
        env:
          VERSION_NAME: ${{ steps.apk-info.outputs.version-name }}
        run: |
          if [ "v${VERSION_NAME}" != "$TAG" ]; then
            echo "::error::This build is v${VERSION_NAME}, but the release notes are for ${TAG}."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # The app shows these lines under "What's new" when it offers this build as an update.
      - name: Put the release notes together
        run: tools/compose_release_body.sh stable "${{ github.repository }}" "$TAG" "$NOTES" > release-notes.md

      - name: Show the release notes
        run: |
          {
            echo "### ${TAG} (${MODE})"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      # No artifact of the APK: it is signed with the release key, and the draft release below holds it, where nobody can see it until it is
      # published. An artifact would be visible to everyone, on a dry run and before the draft is published.

      # Keep this: it is what turns an obfuscated crash trace back into readable code.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-release-notes
          path: release-notes.md
          if-no-files-found: error

      # A draft: it is on GitHub with its page and its APK, but nobody can see it, and the app cannot offer it, until it is published.
      # Only a run that the plan made a real release, on stable, creates it. A dry run ends before this.
      - name: Create release (a draft)
        id: release
        if: needs.plan.outputs.mode == 'release' && github.ref == 'refs/heads/stable'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          make_latest: false
          body_path: release-notes.md
          files: ${{ steps.apk-path.outputs.path }}

      - name: Say how to publish the draft
        if: needs.plan.outputs.mode == 'release' && github.ref == 'refs/heads/stable'
        env:
          URL: ${{ steps.release.outputs.url }}
        run: |
          {
            echo "### ${TAG} is a draft"
            echo
            echo "Nobody can see it yet. Look at the page and the APK first: ${URL}"
            echo
            echo "Publish it, and make it the latest release, with:"
            echo
            echo '```'
            echo "gh release edit ${TAG} --draft=false --latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
